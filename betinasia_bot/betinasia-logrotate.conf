# Logrotate para BetinAsia Bot
# Instalar: sudo cp betinasia-logrotate.conf /etc/logrotate.d/betinasia

/home/betbot/Bets/betinasia_bot/logs/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0644 betbot betbot
    dateext
    dateformat -%Y%m%d
    size 50M
    copytruncate
}
